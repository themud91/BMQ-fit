<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b3202a">
  <title>Exercise Guide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <header class="app-header sticky-top">
    <div class="container py-2">
      <h1 class="h5 mb-2">Exercise Guide</h1>
      <input id="search" type="search" class="form-control mb-2" placeholder="Search exercise" autocomplete="off">
      <div class="row g-2">
        <div class="col-6">
          <select id="filter-category" class="form-select form-select-sm" aria-label="Category"></select>
        </div>
        <div class="col-6">
          <select id="filter-equipment" class="form-select form-select-sm" aria-label="Equipment"></select>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-3">
    <p id="count" class="text-muted small mb-2"></p>
    <div id="list" class="row g-2"></div>
    <p id="empty" class="text-center text-muted mt-4 d-none">No exercise found.</p>
  </main>

  <div class="modal fade" id="detail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="detail-title" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="detail-img" class="img-fluid rounded w-100 mb-3" alt="">
          <p id="detail-tags" class="mb-2"></p>
          <p id="detail-text" class="mb-0"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/ejercicios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
